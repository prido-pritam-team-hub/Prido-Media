<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070a13">
<title>Prido — Creative Social Network</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Outfit','sans-serif']},
colors:{neon:'#06b6d4',violetx:'#8b5cf6',indigox:'#6366f1'}}}};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--bg:#070a13;--panel:rgba(15,20,35,.72);--line:rgba(255,255,255,.09);--muted:#94a3b8;--cyan:#06b6d4;--indigo:#6366f1;--violet:#8b5cf6}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#e5e7eb;font-family:Inter,sans-serif}
body{overflow-x:hidden;background-image:radial-gradient(circle at 15% 5%,rgba(6,182,212,.11),transparent 27%),radial-gradient(circle at 85% 20%,rgba(139,92,246,.12),transparent 30%),radial-gradient(circle at 50% 100%,rgba(99,102,241,.08),transparent 35%)}
.font-display{font-family:Outfit,sans-serif}.glass{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line)}
.glow{box-shadow:0 0 35px rgba(6,182,212,.13)}.btn{transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.gradient-text{background:linear-gradient(90deg,#22d3ee,#818cf8,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-item.active{background:linear-gradient(90deg,rgba(6,182,212,.16),rgba(99,102,241,.12));border-color:rgba(6,182,212,.22);color:#67e8f9}
.nav-item{border:1px solid transparent}.nav-item:hover{background:rgba(255,255,255,.04)}
.avatar{object-fit:cover;background:linear-gradient(135deg,#06b6d4,#6366f1,#8b5cf6)}
.scrollbar::-webkit-scrollbar{width:5px}.scrollbar::-webkit-scrollbar-thumb{background:#263148;border-radius:10px}
.modal-back{background:rgba(2,5,12,.78);backdrop-filter:blur(10px)}.hiddenx{display:none!important}
.input{width:100%;background:rgba(2,6,23,.65);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:#fff;outline:none}
.input:focus{border-color:rgba(6,182,212,.65);box-shadow:0 0 0 3px rgba(6,182,212,.08)}
.chip.active{border-color:rgba(6,182,212,.6);background:rgba(6,182,212,.12);color:#67e8f9}
.media{width:100%;max-height:620px;object-fit:cover;background:#020617}
.post-card{animation:rise .3s ease}.toast{animation:toast .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.dot{box-shadow:0 0 0 3px #070a13}
@media(max-width:1100px){#rightbar{display:none}#feed{max-width:760px;margin:auto}}
@media(max-width:850px){#sidebar{width:76px}#sidebar .brand-text,#sidebar .nav-label,#sidebar .user-info,#sidebar .logout-label{display:none}#sidebar .nav-item{justify-content:center}#main{margin-left:76px}}
@media(max-width:640px){#sidebar{display:none}#main{margin-left:0;padding:12px}.topbar{position:sticky;top:0;z-index:20}.hide-mobile{display:none!important}}
</style>
</head>
<body>
<div id="app" class="min-h-screen">
  <aside id="sidebar" class="fixed left-0 top-0 bottom-0 w-[260px] z-30 p-4 border-r border-white/5 bg-[#080c16]/90 backdrop-blur-xl">
    <div class="h-full flex flex-col">
      <div class="px-3 py-3 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 via-indigo-500 to-violet-500 grid place-items-center shadow-lg shadow-cyan-500/20"><i class="fa-solid fa-bolt text-white"></i></div>
        <div class="brand-text"><div class="font-display font-extrabold text-xl tracking-wide">PRI<span class="gradient-text">DO</span></div><div class="text-[10px] text-slate-500 tracking-[.25em] uppercase">Social Network</div></div>
      </div>
      <nav id="nav" class="mt-7 space-y-1"></nav>
      <div class="mt-auto">
        <div id="sideUser" class="glass rounded-2xl p-3 mb-3"></div>
        <button onclick="logout()" class="btn w-full rounded-xl py-3 bg-red-500/10 border border-red-500/20 text-red-300 hover:bg-red-500/15"><i class="fa-solid fa-right-from-bracket mr-2"></i><span class="logout-label">Logout</span></button>
      </div>
    </div>
  </aside>

  <main id="main" class="ml-[260px] p-4 md:p-6">
    <div class="max-w-[1500px] mx-auto grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_330px] gap-5">
      <section id="feed" class="min-w-0">
        <header class="topbar glass rounded-2xl px-4 py-3 flex items-center gap-3 mb-5">
          <button onclick="toggleMobileNav()" class="hidden sm:hidden max-sm:grid w-10 h-10 rounded-xl bg-white/5 place-items-center"><i class="fa-solid fa-bars"></i></button>
          <div class="flex-1"><h1 id="pageTitle" class="font-display text-xl font-bold">Your Feed</h1><p id="pageSub" class="text-xs text-slate-500">Ideas from your creative network</p></div>
          <button onclick="openSearch()" class="btn w-10 h-10 rounded-xl bg-white/5 border border-white/10"><i class="fa-solid fa-magnifying-glass"></i></button>
          <button onclick="openNotifications()" class="btn relative w-10 h-10 rounded-xl bg-white/5 border border-white/10"><i class="fa-regular fa-bell"></i><span id="notifDot" class="hidden absolute top-2 right-2 w-2 h-2 rounded-full bg-cyan-400 dot"></span></button>
        </header>
        <div id="content"></div>
      </section>
      <aside id="rightbar" class="space-y-4">
        <div class="glass rounded-2xl p-4">
          <div class="flex items-center justify-between mb-3"><h3 class="font-display font-semibold">Find creators</h3><button onclick="openSearch()" class="text-xs text-cyan-300">View all</button></div>
          <div class="relative"><i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-500 text-sm"></i><input id="globalSearch" oninput="renderRightSearch()" class="input pl-9" placeholder="Search people..."></div>
          <div id="rightSearch" class="mt-3 space-y-2"></div>
        </div>
        <div class="glass rounded-2xl p-4"><div class="flex items-center justify-between mb-3"><h3 class="font-display font-semibold">Suggested</h3><button onclick="showView('explore')" class="text-xs text-cyan-300">Explore</button></div><div id="suggestions" class="space-y-3"></div></div>
        <div class="glass rounded-2xl p-4"><h3 class="font-display font-semibold mb-3">Live activity</h3><div id="activity" class="space-y-3"></div></div>
        <div class="glass rounded-2xl p-4"><h3 class="font-display font-semibold mb-3">Trending</h3><div id="trends" class="flex flex-wrap gap-2"></div></div>
      </aside>
    </div>
  </main>
</div>

<div id="auth" class="fixed inset-0 z-[100] modal-back grid place-items-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-7 glow">
    <div class="text-center mb-6"><div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-400 to-violet-500 grid place-items-center text-xl"><i class="fa-solid fa-bolt"></i></div><h1 class="font-display text-3xl font-extrabold mt-3">Welcome to <span class="gradient-text">Prido</span></h1><p class="text-slate-400 text-sm mt-1">Create. Connect. Build the future.</p></div>
    <div id="authForms"></div>
  </div>
</div>

<div id="modalRoot"></div><div id="toastRoot" class="fixed right-5 bottom-5 z-[200] space-y-2"></div>

<script>
"use strict";
const KEY="prido_state_v1", SESSION="prido_session_v1", bc="BroadcastChannel" in window?new BroadcastChannel("prido_network"):null;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2);
const now=()=>new Date().toISOString();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const img=(u,f="https://i.pravatar.cc/150?img=12")=>u||f;
const defaultState={
 users:[
  {id:"u1",name:"Pritam Kumar",username:"pritam",email:"pritam@prido.dev",password:"demo123",bio:"Building ideas at the edge of code & creativity.",avatar:"https://i.pravatar.cc/150?img=12",cover:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80",location:"Bihar, India",website:"https://prido.dev",phone:"",tags:["JavaScript","AI","UI/UX"],followers:["u2","u3"],following:["u2"],verified:true},
  {id:"u2",name:"Aarav Singh",username:"aarav",email:"aarav@prido.dev",password:"demo123",bio:"Frontend engineer • motion • open web.",avatar:"https://i.pravatar.cc/150?img=33",cover:"https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1400&q=80",location:"Delhi, India",website:"",phone:"",tags:["CSS","Motion"],followers:["u1"],following:["u1","u3"],verified:true},
  {id:"u3",name:"Maya Chen",username:"mayac",email:"maya@prido.dev",password:"demo123",bio:"Visual designer turning pixels into stories.",avatar:"https://i.pravatar.cc/150?img=47",cover:"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=80",location:"Singapore",website:"",phone:"",tags:["Design","Creative"],followers:["u1","u2"],following:[],verified:true},
  {id:"u4",name:"Dev Patel",username:"devpatel",email:"dev@prido.dev",password:"demo123",bio:"Learning in public. Shipping tiny experiments.",avatar:"https://i.pravatar.cc/150?img=59",cover:"",location:"Mumbai, India",website:"",phone:"",tags:["HTML","JavaScript"],followers:[],following:["u1"],verified:false}
 ],
 posts:[
  {id:"p1",userId:"u2",type:"idea",category:"Ideas",text:"Small interfaces become memorable when every interaction has a reason. Build less, polish more. ✨",createdAt:"2026-10-08T06:00:00Z",likes:["u1","u3"],comments:[{id:"c1",userId:"u1",text:"This is such a good rule.",createdAt:"2026-10-08T07:00:00Z"}],savedBy:["u1"]},
  {id:"p2",userId:"u3",type:"image",category:"Images",text:"A quiet desk before a loud creative session.",media:"https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1400&q=85",createdAt:"2026-10-07T16:20:00Z",likes:["u1","u2"],comments:[],savedBy:[]},
  {id:"p3",userId:"u1",type:"creative",category:"Creative",text:"Prototype mode: neon glass + useful micro-interactions. What should I build next?",media:"https://images.unsplash.com/photo-1558655146-9f40138edfeb?auto=format&fit=crop&w=1400&q=85",createdAt:"2026-10-06T10:30:00Z",likes:["u2","u3","u4"],comments:[{id:"c2",userId:"u3",text:"The visual language is 🔥",createdAt:"2026-10-06T11:10:00Z"}],savedBy:["u2"]},
  {id:"p4",userId:"u4",type:"video",category:"Videos",text:"Quick JavaScript experiment.",media:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",createdAt:"2026-10-05T09:00:00Z",likes:["u2"],comments:[],savedBy:[]}
 ],
 messages:[
  {id:"m1",from:"u2",to:"u1",text:"Your new prototype looks awesome!",createdAt:"2026-10-08T08:00:00Z",read:true},
  {id:"m2",from:"u1",to:"u2",text:"Thanks! I’m adding the social graph next.",createdAt:"2026-10-08T08:04:00Z",read:true},
  {id:"m3",from:"u3",to:"u1",text:"Let’s collaborate on the visual system.",createdAt:"2026-10-08T09:10:00Z",read:false}
 ],
 notifications:[{id:"n1",userId:"u1",text:"Maya Chen liked your post.",createdAt:"2026-10-08T09:00:00Z",read:false}],
 activity:[]
};
let state,session=localStorage.getItem(SESSION),view="feed",filter="All",activeChat=null;
function load(){try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch(e){state=structuredClone(defaultState)} if(!localStorage.getItem(KEY))save(false); if(!session)renderAuth();else boot();}
function save(broadcast=true){localStorage.setItem(KEY,JSON.stringify(state));if(broadcast&&bc)bc.postMessage({type:"sync",at:Date.now()})}
function current(){return state.users.find(u=>u.id===session)}
function getUser(id){return state.users.find(u=>u.id===id)}
function formatTime(x){let d=new Date(x),s=Math.floor((Date.now()-d)/1000);if(s<60)return "now";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function avatar(u,size="w-9 h-9"){return `<img class="${size} rounded-full avatar border border-white/10" src="${esc(img(u?.avatar))}" alt="">`}
function navRender(){document.getElementById("nav").innerHTML=[
 ["feed","fa-house","Feed"],["explore","fa-compass","Explore"],["messages","fa-paper-plane","Direct Messages"],["saved","fa-bookmark","Saved Posts"],["profile","fa-user","Profile"],["settings","fa-gear","Settings"]
].map(([v,i,t])=>`<button onclick="showView('${v}')" class="nav-item ${view===v?"active":""} w-full rounded-xl px-3 py-3 flex items-center gap-3 text-slate-300"><i class="fa-solid ${i} w-5 text-center"></i><span class="nav-label text-sm">${t}</span></button>`).join("")}
function sideUser(){let u=current();document.getElementById("sideUser").innerHTML=`<div class="flex items-center gap-3">${avatar(u,"w-10 h-10")}<div class="user-info min-w-0"><div class="font-semibold text-sm truncate">${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400 text-[11px]"></i>':''}</div><div class="text-xs text-slate-500">@${esc(u.username)}</div></div></div>`}
function shell(){navRender();sideUser();renderSuggestions();renderActivity();renderTrends();renderRightSearch();document.getElementById("notifDot").classList.toggle("hidden",!state.notifications.some(n=>n.userId===session&&!n.read))}
function boot(){document.getElementById("auth").classList.add("hiddenx");shell();showView(view)}
function renderAuth(mode="signin"){document.getElementById("auth").classList.remove("hiddenx");document.getElementById("authForms").innerHTML=mode==="signup"?signupForm():signinForm()}
function signinForm(){return `<form onsubmit="signin(event)" class="space-y-3"><input id="loginId" class="input" placeholder="Username or email" required><input id="loginPass" class="input" type="password" placeholder="Password" required><button class="btn w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-500 font-bold">Sign In</button><button type="button" onclick="guest()" class="btn w-full py-3 rounded-xl bg-white/5 border border-white/10">⚡ Continue as Demo User</button><div class="flex justify-between text-sm pt-2"><button type="button" onclick="renderAuth('signup')" class="text-cyan-300">Create account</button><button type="button" onclick="forgot()" class="text-slate-400">Forgot password?</button></div><p class="text-[11px] text-center text-slate-500 pt-3">Demo accounts use password <b>demo123</b>.</p></form>`}
function signupForm(){return `<form onsubmit="signup(event)" class="space-y-3"><input id="suName" class="input" placeholder="Display name" required><input id="suUser" class="input" placeholder="@username" pattern="[A-Za-z0-9_]{3,20}" required><input id="suEmail" class="input" type="email" placeholder="Email" required><input id="suPass" class="input" type="password" minlength="6" placeholder="Password (6+ chars)" required><label class="flex gap-2 items-start text-xs text-slate-400"><input id="terms" type="checkbox" onchange="document.getElementById('suBtn').disabled=!this.checked" class="mt-1"> I agree to the Privacy Policy and Terms of Service.</label><button id="suBtn" disabled class="btn w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-violet-500 font-bold disabled:opacity-40">Create Prido Account</button><button type="button" onclick="renderAuth('signin')" class="w-full text-sm text-slate-400">← Back to sign in</button></form>`}
function signin(e){e.preventDefault();let id=document.getElementById("loginId").value.trim().toLowerCase(),p=document.getElementById("loginPass").value,u=state.users.find(x=>(x.username.toLowerCase()===id||x.email.toLowerCase()===id)&&x.password===p);if(!u)return toast("Invalid login details","error");session=u.id;localStorage.setItem(SESSION,session);toast("Welcome back, "+u.name.split(" ")[0]+"!");boot()}
function guest(){session="u1";localStorage.setItem(SESSION,session);toast("Demo session started");boot()}
function signup(e){e.preventDefault();let name=document.getElementById("suName").value.trim(),username=document.getElementById("suUser").value.trim().replace(/^@/,"").toLowerCase(),email=document.getElementById("suEmail").value.trim().toLowerCase(),password=document.getElementById("suPass").value;if(state.users.some(u=>u.username===username||u.email===email))return toast("Username or email already exists","error");let u={id:uid(),name,username,email,password,bio:"New creator on Prido.",avatar:`https://i.pravatar.cc/150?u=${encodeURIComponent(email)}`,cover:"",location:"",website:"",phone:"",tags:["Creator"],followers:[],following:[],verified:false};state.users.push(u);session=u.id;localStorage.setItem(SESSION,session);save();boot();toast("Account created successfully")}
function forgot(){openModal("Reset password",`<form onsubmit="resetDemo(event)" class="space-y-3"><input id="resetEmail" class="input" type="email" placeholder="Your email" required><button class="btn w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-500">Send reset link</button><p class="text-xs text-slate-500">Demo mode simulates delivery; no email is actually sent.</p></form>`)}
function resetDemo(e){e.preventDefault();closeModal();toast("Demo reset link/OTP simulated ✓")}
function logout(){openModal("Sign out?",`<div class="space-y-4"><div class="p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-sm text-red-200"><i class="fa-solid fa-shield-halved mr-2"></i>Your local session will be removed from this browser.</div><div class="flex gap-2"><button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-white/5">Cancel</button><button onclick="confirmLogout()" class="flex-1 py-3 rounded-xl bg-red-500/80 font-semibold">Logout</button></div></div>`)}
function confirmLogout(){session=null;localStorage.removeItem(SESSION);closeModal();renderAuth()}
function showView(v){view=v;filter="All";shell();let titles={feed:["Your Feed","Ideas from your creative network"],explore:["Explore","Discover creators, ideas and media"],messages:["Direct Messages","Private conversations across Prido"],saved:["Saved Posts","Your personal collection"],profile:["Your Profile","Manage your public creator identity"],settings:["Settings","Account and application preferences"]};document.getElementById("pageTitle").textContent=titles[v][0];document.getElementById("pageSub").textContent=titles[v][1];if(v==="feed")renderFeed();if(v==="explore")renderExplore();if(v==="messages")renderMessages();if(v==="saved")renderSaved();if(v==="profile")renderProfile(current().id);if(v==="settings")renderSettings()}
function createComposer(){return `<div class="glass rounded-2xl p-4 mb-4"><div class="flex gap-3">${avatar(current(),"w-11 h-11")}<button onclick="openPostComposer()" class="flex-1 text-left px-4 rounded-xl bg-white/[.035] border border-white/5 text-slate-500 hover:bg-white/[.05]">Share an idea, image, video or creative...</button></div><div class="flex gap-2 mt-3 pl-14"><button onclick="openPostComposer('idea')" class="chip px-3 py-1.5 rounded-lg border border-white/10 text-xs"><i class="fa-regular fa-lightbulb mr-1"></i> Idea</button><button onclick="openPostComposer('image')" class="chip px-3 py-1.5 rounded-lg border border-white/10 text-xs"><i class="fa-regular fa-image mr-1"></i> Image</button><button onclick="openPostComposer('video')" class="chip px-3 py-1.5 rounded-lg border border-white/10 text-xs"><i class="fa-solid fa-video mr-1"></i> Video</button></div></div>`}
function filters(){return `<div class="flex gap-2 overflow-x-auto pb-3 scrollbar">${["All","Ideas","Images","Videos","Creative"].map(x=>`<button onclick="setFilter('${x}')" class="chip ${filter===x?"active":""} shrink-0 px-4 py-2 rounded-full border border-white/10 text-xs">${x}</button>`).join("")}</div>`}
function setFilter(x){filter=x;renderFeed()}
function postsFor(){let a=[...state.posts].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return filter==="All"?a:a.filter(p=>p.category===filter)}
function postHTML(p){let u=getUser(p.userId),me=current(),liked=p.likes.includes(session),saved=p.savedBy.includes(session),following=me.following.includes(u.id);return `<article class="post-card glass rounded-2xl overflow-hidden mb-4" id="post-${p.id}"><div class="p-4 flex items-center gap-3"><button onclick="renderProfile('${u.id}')">${avatar(u,"w-10 h-10")}</button><div class="flex-1 min-w-0"><div class="font-semibold text-sm">${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400"></i>':''}</div><div class="text-xs text-slate-500">@${esc(u.username)} · ${formatTime(p.createdAt)}</div></div>${u.id!==session?`<button onclick="toggleFollow('${u.id}')" class="text-xs px-3 py-1.5 rounded-lg border ${following?"border-white/10 text-slate-400":"border-cyan-500/30 text-cyan-300"}">${following?"Following":"Follow"}</button>`:""}${u.id===session?`<button onclick="deletePost('${p.id}')" class="w-8 h-8 rounded-lg hover:bg-red-500/10 text-slate-500 hover:text-red-300"><i class="fa-solid fa-ellipsis"></i></button>`:""}</div><div class="px-4 pb-3"><p class="text-[15px] leading-7 whitespace-pre-wrap">${esc(p.text)}</p></div>${p.media?(p.type==="video"?`<video class="media" controls preload="metadata" src="${esc(p.media)}"></video>`:`<img class="media cursor-zoom-in" onclick="viewMedia('${esc(p.media)}')" src="${esc(p.media)}" alt="Post media" loading="lazy">`):""}<div class="px-4 py-3 flex items-center gap-5 border-t border-white/5"><button onclick="toggleLike('${p.id}')" class="text-sm ${liked?"text-pink-400":"text-slate-400"}"><i class="${liked?"fa-solid":"fa-regular"} fa-heart mr-1"></i>${p.likes.length}</button><button onclick="focusComment('${p.id}')" class="text-sm text-slate-400"><i class="fa-regular fa-comment mr-1"></i>${p.comments.length}</button><button onclick="toggleSave('${p.id}')" class="text-sm ${saved?"text-cyan-300":"text-slate-400"}"><i class="${saved?"fa-solid":"fa-regular"} fa-bookmark"></i></button><button onclick="sharePost('${p.id}')" class="text-sm text-slate-400"><i class="fa-solid fa-share-nodes"></i></button></div><div class="px-4 pb-4"><div class="space-y-2 mb-3">${p.comments.slice(-3).map(c=>{let cu=getUser(c.userId);return `<div class="flex gap-2 text-xs"><img src="${esc(img(cu.avatar))}" class="w-6 h-6 rounded-full"><div><b>${esc(cu.username)}</b> <span class="text-slate-400">${esc(c.text)}</span></div></div>`}).join("")}</div><div class="flex gap-2"><input id="comment-${p.id}" class="input !py-2.5 text-sm" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')addComment('${p.id}')"><button onclick="addComment('${p.id}')" class="px-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-300"><i class="fa-solid fa-paper-plane"></i></button></div></div></article>`}
function renderFeed(){document.getElementById("content").innerHTML=createComposer()+filters()+`<div>${postsFor().map(postHTML).join("")||empty("No posts in this filter yet.")}</div>`}
function renderExplore(){let creators=state.users.filter(u=>u.id!==session);document.getElementById("content").innerHTML=`<div class="glass rounded-2xl p-5 mb-4"><h2 class="font-display text-2xl font-bold">Explore the network</h2><p class="text-sm text-slate-500 mt-1">Meet people building interesting things.</p></div><div class="grid sm:grid-cols-2 gap-4 mb-5">${creators.map(userCard).join("")}</div>${state.posts.map(postHTML).join("")}`}
function userCard(u){let me=current(),following=me.following.includes(u.id);return `<div class="glass rounded-2xl overflow-hidden"><div class="h-20 bg-gradient-to-r from-cyan-500/20 to-violet-500/20" style="background-image:url('${esc(u.cover||"")}');background-size:cover;background-position:center"></div><div class="p-4 -mt-8"><div class="flex items-end justify-between">${avatar(u,"w-16 h-16 border-4 border-[#0b0f1b]")}<button onclick="toggleFollow('${u.id}')" class="px-3 py-1.5 rounded-lg border text-xs ${following?"border-white/10":"border-cyan-500/30 text-cyan-300"}">${following?"Following":"Follow"}</button></div><div class="mt-2 font-semibold">${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400 text-xs"></i>':''}</div><div class="text-xs text-slate-500">@${esc(u.username)}</div><p class="text-sm text-slate-400 mt-2 line-clamp-2">${esc(u.bio)}</p><div class="flex gap-4 mt-3 text-xs text-slate-500"><span><b class="text-slate-200">${state.posts.filter(p=>p.userId===u.id).length}</b> posts</span><span><b class="text-slate-200">${u.followers.length}</b> followers</span></div></div></div>`}
function renderSaved(){let ps=state.posts.filter(p=>p.savedBy.includes(session));document.getElementById("content").innerHTML=`<div class="glass rounded-2xl p-5 mb-4"><h2 class="font-display text-2xl font-bold">Saved Posts</h2><p class="text-sm text-slate-500 mt-1">Only you can see your saved collection.</p></div>${ps.map(postHTML).join("")||empty("Your saved collection is empty.")}`}
function renderProfile(id){let u=getUser(id),own=id===session,me=current(),ps=state.posts.filter(p=>p.userId===id),following=me.following.includes(id);document.getElementById("pageTitle").textContent=own?"Your Profile":u.name;document.getElementById("content").innerHTML=`<div class="glass rounded-2xl overflow-hidden mb-4"><div class="h-36 sm:h-48 bg-gradient-to-r from-cyan-500/20 via-indigo-500/20 to-violet-500/20" style="${u.cover?`background-image:url('${esc(u.cover)}');background-size:cover;background-position:center`:''}"></div><div class="p-5 -mt-12 relative"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3">${avatar(u,"w-24 h-24 border-4 border-[#0b0f1b]")}<div class="flex gap-2">${own?`<button onclick="editProfile()" class="px-4 py-2 rounded-xl border border-white/10 bg-white/5 text-sm">Edit profile</button>`:`<button onclick="toggleFollow('${u.id}')" class="px-5 py-2 rounded-xl ${following?"bg-white/5 border border-white/10":"bg-gradient-to-r from-cyan-500 to-indigo-500"} text-sm font-semibold">${following?"Following":"Follow"}</button><button onclick="startChat('${u.id}')" class="px-4 py-2 rounded-xl border border-white/10 bg-white/5 text-sm"><i class="fa-regular fa-paper-plane"></i></button>`}</div></div><div class="mt-3"><h2 class="font-display text-2xl font-bold">${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400 text-sm"></i>':''}</h2><div class="text-sm text-slate-500">@${esc(u.username)}</div><p class="text-sm text-slate-300 mt-3 max-w-2xl">${esc(u.bio)}</p><div class="flex flex-wrap gap-2 mt-3">${u.tags.map(t=>`<span class="text-xs px-2.5 py-1 rounded-full bg-white/5 border border-white/5">#${esc(t)}</span>`).join("")}</div><div class="flex flex-wrap gap-4 mt-4 text-xs text-slate-500">${u.location?`<span><i class="fa-solid fa-location-dot mr-1"></i>${esc(u.location)}</span>`:""}${u.website?`<span><i class="fa-solid fa-link mr-1"></i>${esc(u.website)}</span>`:""}</div><div class="flex gap-6 mt-5"><span><b>${ps.length}</b> <small class="text-slate-500">Posts</small></span><span><b>${u.followers.length}</b> <small class="text-slate-500">Followers</small></span><span><b>${u.following.length}</b> <small class="text-slate-500">Following</small></span></div></div></div></div><div class="grid sm:grid-cols-2 gap-4">${ps.map(postHTML).join("")||empty("No posts yet.")}</div>`}
function renderSettings(){let u=current();document.getElementById("content").innerHTML=`<div class="space-y-4"><div class="glass rounded-2xl p-5"><h2 class="font-display text-2xl font-bold">Account Settings</h2><p class="text-sm text-slate-500 mt-1">Local-first preferences for this demo app.</p></div><div class="glass rounded-2xl p-5 space-y-4"><div class="flex items-center justify-between"><div><b>Session persistence</b><p class="text-xs text-slate-500">Your active session survives refreshes.</p></div><span class="text-cyan-300 text-sm"><i class="fa-solid fa-circle-check"></i> Enabled</span></div><div class="flex items-center justify-between"><div><b>Cross-tab sync</b><p class="text-xs text-slate-500">BroadcastChannel + storage events.</p></div><span class="text-cyan-300 text-sm"><i class="fa-solid fa-bolt"></i> Active</span></div><button onclick="editProfile()" class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm">Edit profile</button></div><div class="glass rounded-2xl p-5"><h3 class="font-semibold mb-2">Demo data</h3><p class="text-xs text-slate-500 mb-3">Reset all local Prido data to the seeded demo state.</p><button onclick="resetData()" class="px-4 py-2 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-sm">Reset local data</button></div></div>`}
function renderMessages(){let users=state.users.filter(u=>u.id!==session),list=users.map(u=>{let msgs=state.messages.filter(m=>(m.from===session&&m.to===u.id)||(m.from===u.id&&m.to===session)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),last=msgs[0];let unread=state.messages.filter(m=>m.from===u.id&&m.to===session&&!m.read).length;return `<button onclick="startChat('${u.id}')" class="w-full text-left p-3 rounded-xl hover:bg-white/5 flex gap-3 ${activeChat===u.id?"bg-white/5":""}">${avatar(u,"w-11 h-11")}<div class="min-w-0 flex-1"><div class="flex justify-between"><b class="text-sm">${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400 text-xs"></i>':''}</b>${unread?`<span class="text-[10px] bg-cyan-500 text-black px-1.5 rounded-full">${unread}</span>`:""}</div><div class="text-xs text-slate-500 truncate">${last?esc(last.text):"Start a conversation"}</div></div></button>`}).join("");let chat=activeChat?chatHTML(getUser(activeChat)):`<div class="h-full min-h-[500px] grid place-items-center text-center text-slate-500"><i class="fa-regular fa-paper-plane text-4xl mb-3"></i><p>Select a creator to start chatting.</p></div>`;document.getElementById("content").innerHTML=`<div class="glass rounded-2xl overflow-hidden grid lg:grid-cols-[280px_minmax(0,1fr)] min-h-[600px]"><div class="border-r border-white/5 p-3"><div class="font-display font-bold text-lg p-2 mb-2">Messages</div><input class="input !py-2.5 mb-2" placeholder="Search people..." oninput="filterChatList(this.value)"><div id="chatList" class="space-y-1">${list}</div></div><div>${chat}</div></div>`}
function filterChatList(q){let items=[...document.querySelectorAll("#chatList button")];items.forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q.toLowerCase())?"flex":"none")}
function chatHTML(u){let msgs=state.messages.filter(m=>(m.from===session&&m.to===u.id)||(m.from===u.id&&m.to===session)).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));state.messages.forEach(m=>{if(m.from===u.id&&m.to===session)m.read=true});return `<div class="flex flex-col h-full min-h-[600px]"><div class="p-4 border-b border-white/5 flex items-center gap-3">${avatar(u,"w-10 h-10")}<div><b>${esc(u.name)} ${u.verified?'<i class="fa-solid fa-circle-check text-cyan-400"></i>':''}</b><div class="text-xs text-slate-500">@${esc(u.username)}</div></div></div><div id="chatScroll" class="flex-1 p-4 overflow-y-auto scrollbar space-y-2">${msgs.map(m=>`<div class="flex ${m.from===session?"justify-end":"justify-start"}"><div class="max-w-[75%] px-3.5 py-2.5 rounded-2xl text-sm ${m.from===session?"bg-gradient-to-r from-cyan-500/20 to-indigo-500/20 border border-cyan-500/10":"bg-white/5 border border-white/5"}">${esc(m.text)}<div class="text-[9px] text-slate-500 mt-1 text-right">${formatTime(m.createdAt)}</div></div></div>`).join("")||`<div class="h-full grid place-items-center text-slate-500 text-sm">Say hello 👋</div>`}</div><form onsubmit="sendMessage(event)" class="p-3 border-t border-white/5 flex gap-2"><input id="messageInput" class="input" placeholder="Write a message..." autocomplete="off"><button class="w-12 rounded-xl bg-cyan-500/15 border border-cyan-500/20 text-cyan-300"><i class="fa-solid fa-paper-plane"></i></button></form></div>`}
function startChat(id){activeChat=id;showView("messages");setTimeout(()=>{let s=document.getElementById("chatScroll");if(s)s.scrollTop=s.scrollHeight},50)}
function sendMessage(e){e.preventDefault();let input=document.getElementById("messageInput"),text=input.value.trim();if(!text||!activeChat)return;state.messages.push({id:uid(),from:session,to:activeChat,text,createdAt:now(),read:false});save();input.value="";renderMessages();setTimeout(()=>{let s=document.getElementById("chatScroll");if(s)s.scrollTop=s.scrollHeight},20)}
function toggleLike(id){let p=state.posts.find(x=>x.id===id),i=p.likes.indexOf(session);i>=0?p.likes.splice(i,1):p.likes.push(session);save();renderCurrent()}
function addComment(id){let input=document.getElementById("comment-"+id),text=input?.value.trim();if(!text)return;state.posts.find(p=>p.id===id).comments.push({id:uid(),userId:session,text,createdAt:now()});save();renderCurrent()}
function toggleSave(id){let p=state.posts.find(x=>x.id===id),i=p.savedBy.indexOf(session);i>=0?p.savedBy.splice(i,1):p.savedBy.push(session);save();renderCurrent()}
function toggleFollow(id){let me=current(),u=getUser(id),i=me.following.indexOf(id);if(i>=0){me.following.splice(i,1);u.followers=u.followers.filter(x=>x!==session);toast("Unfollowed @"+u.username)}else{me.following.push(id);if(!u.followers.includes(session))u.followers.push(session);toast("Following @"+u.username)}save();renderCurrent();shell()}
function deletePost(id){openModal("Delete post?",`<div class="space-y-4"><p class="text-sm text-slate-400">This permanently deletes the post from local Prido data.</p><div class="flex gap-2"><button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-white/5">Cancel</button><button onclick="confirmDeletePost('${id}')" class="flex-1 py-3 rounded-xl bg-red-500/80">Delete permanently</button></div></div>`)}
function confirmDeletePost(id){state.posts=state.posts.filter(p=>p.id!==id);save();closeModal();toast("Post deleted");renderCurrent()}
function renderCurrent(){if(view==="feed")renderFeed();else if(view==="saved")renderSaved();else if(view==="messages")renderMessages();else if(view==="profile")renderProfile(current().id);else if(view==="explore")renderExplore()}
function openPostComposer(type="idea"){let isMedia=type==="image"||type==="video";openModal("Create a post",`<form onsubmit="createPost(event)" class="space-y-3"><div class="flex gap-2">${["idea","creative","image","video"].map(t=>`<button type="button" onclick="setPostType('${t}')" id="type-${t}" class="posttype px-3 py-2 rounded-xl border ${t===type?"border-cyan-400/50 bg-cyan-400/10 text-cyan-300":"border-white/10 bg-white/5"} text-xs">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div><input type="hidden" id="postType" value="${type}"><textarea id="postText" class="input min-h-32 resize-none" placeholder="What's on your mind?" required></textarea><div id="mediaField" class="${isMedia?"":"hiddenx"}"><input id="postMedia" class="input" placeholder="${type==="video"?"Direct MP4 URL or YouTube URL":"Image URL"}"></div><button class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-500 font-bold">Publish</button></form>`)}
function setPostType(t){document.getElementById("postType").value=t;document.querySelectorAll(".posttype").forEach(x=>x.classList.remove("border-cyan-400/50","bg-cyan-400/10","text-cyan-300"));document.getElementById("type-"+t).classList.add("border-cyan-400/50","bg-cyan-400/10","text-cyan-300");document.getElementById("mediaField").classList.toggle("hiddenx",!(t==="image"||t==="video"))}
function createPost(e){e.preventDefault();let t=document.getElementById("postType").value,media=document.getElementById("postMedia")?.value.trim()||"";if(t==="video"&&/youtube\.com|youtu\.be/.test(media))return toast("For YouTube, use a direct MP4 URL in this demo.","error");state.posts.unshift({id:uid(),userId:session,type:t,category:t==="creative"?"Creative":t==="image"?"Images":t==="video"?"Videos":"Ideas",text:document.getElementById("postText").value.trim(),media,createdAt:now(),likes:[],comments:[],savedBy:[]});save();closeModal();toast("Published to the global feed ✨");showView("feed")}
function sharePost(id){let link=location.href.split("#")[0]+"#post-"+id;navigator.clipboard?.writeText(link).catch(()=>{});toast("Post link copied")}
function focusComment(id){document.getElementById("comment-"+id)?.focus()}
function viewMedia(src){openModal("Media viewer",`<img src="${esc(src)}" class="w-full max-h-[75vh] object-contain rounded-xl">`)}
function editProfile(){let u=current();openModal("Edit profile",`<form onsubmit="saveProfile(event)" class="grid sm:grid-cols-2 gap-3"><input id="pName" class="input" value="${esc(u.name)}" placeholder="Display name" required><input id="pUsername" class="input" value="${esc(u.username)}" placeholder="@username" required><input id="pAvatar" class="input sm:col-span-2" value="${esc(u.avatar)}" placeholder="Avatar image URL"><input id="pCover" class="input sm:col-span-2" value="${esc(u.cover)}" placeholder="Cover banner URL"><textarea id="pBio" class="input sm:col-span-2 min-h-24" placeholder="Bio">${esc(u.bio)}</textarea><input id="pLocation" class="input" value="${esc(u.location)}" placeholder="Location"><input id="pWebsite" class="input" value="${esc(u.website)}" placeholder="Website URL"><input id="pPhone" class="input" value="${esc(u.phone)}" placeholder="Phone number"><input id="pTags" class="input" value="${esc(u.tags.join(", "))}" placeholder="Tech / creative tags"><button class="sm:col-span-2 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-500 font-bold">Save profile</button></form>`)}
function saveProfile(e){e.preventDefault();let u=current();u.name=document.getElementById("pName").value.trim();u.username=document.getElementById("pUsername").value.trim().replace(/^@/,"");u.avatar=document.getElementById("pAvatar").value.trim();u.cover=document.getElementById("pCover").value.trim();u.bio=document.getElementById("pBio").value.trim();u.location=document.getElementById("pLocation").value.trim();u.website=document.getElementById("pWebsite").value.trim();u.phone=document.getElementById("pPhone").value.trim();u.tags=document.getElementById("pTags").value.split(",").map(x=>x.trim()).filter(Boolean);save();closeModal();shell();renderProfile(u.id);toast("Profile updated")}
function openSearch(){openModal("Search Prido",`<input id="modalSearch" oninput="renderModalSearch()" class="input" placeholder="Search creators, usernames..."><div id="modalSearchResults" class="mt-4 space-y-2">${state.users.filter(u=>u.id!==session).map(searchUserHTML).join("")}</div>`)}
function searchUserHTML(u){return `<button onclick="closeModal();renderProfile('${u.id}')" class="w-full p-3 rounded-xl hover:bg-white/5 flex items-center gap-3 text-left">${avatar(u,"w-10 h-10")}<div><b class="text-sm">${esc(u.name)}</b><div class="text-xs text-slate-500">@${esc(u.username)}</div></div></button>`}
function renderModalSearch(){let q=document.getElementById("modalSearch").value.toLowerCase();document.getElementById("modalSearchResults").innerHTML=state.users.filter(u=>u.id!==session&&(u.name.toLowerCase().includes(q)||u.username.toLowerCase().includes(q))).map(searchUserHTML).join("")||empty("No creators found.")}
function openNotifications(){let ns=state.notifications.filter(n=>n.userId===session).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));ns.forEach(n=>n.read=true);save(false);document.getElementById("notifDot").classList.add("hidden");openModal("Notifications",`<div class="space-y-2">${ns.map(n=>`<div class="p-3 rounded-xl bg-white/5"><div class="text-sm">${esc(n.text)}</div><div class="text-xs text-slate-500 mt-1">${formatTime(n.createdAt)}</div></div>`).join("")||empty("No notifications.")}</div>`)}
function openModal(title,body){document.getElementById("modalRoot").innerHTML=`<div class="fixed inset-0 z-[150] modal-back grid place-items-center p-4" onclick="if(event.target===this)closeModal()"><div class="glass w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-2xl p-5"><div class="flex items-center mb-4"><h2 class="font-display text-xl font-bold flex-1">${esc(title)}</h2><button onclick="closeModal()" class="w-9 h-9 rounded-lg bg-white/5"><i class="fa-solid fa-xmark"></i></button></div>${body}</div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function toast(msg,type="ok"){let d=document.createElement("div");d.className="toast glass rounded-xl px-4 py-3 text-sm flex items-center gap-2 "+(type==="error"?"text-red-300":"text-slate-200");d.innerHTML=`<i class="fa-solid ${type==="error"?"fa-circle-exclamation":"fa-circle-check"} ${type==="error"?"text-red-400":"text-cyan-400"}"></i>${esc(msg)}`;document.getElementById("toastRoot").appendChild(d);setTimeout(()=>d.remove(),2800)}
function empty(t){return `<div class="glass rounded-2xl p-10 text-center text-slate-500"><i class="fa-regular fa-face-smile text-3xl mb-3"></i><p>${esc(t)}</p></div>`}
function renderSuggestions(){let me=current();document.getElementById("suggestions").innerHTML=state.users.filter(u=>u.id!==session&&!me.following.includes(u.id)).slice(0,3).map(u=>`<div class="flex items-center gap-2">${avatar(u,"w-9 h-9")}<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${esc(u.name)}</div><div class="text-xs text-slate-500">@${esc(u.username)}</div></div><button onclick="toggleFollow('${u.id}')" class="text-xs text-cyan-300">Follow</button></div>`).join("")||`<div class="text-xs text-slate-500">You're following everyone in the demo.</div>`}
function renderActivity(){let a=[...state.posts].sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt)).slice(0,4);document.getElementById("activity").innerHTML=a.map(p=>{let u=getUser(p.userId);return `<div class="flex gap-2 items-center">${avatar(u,"w-7 h-7")}<div class="text-xs"><b>${esc(u.username)}</b> shared a ${p.category.toLowerCase()}<div class="text-[10px] text-slate-600">${formatTime(p.createdAt)}</div></div></div>`}).join("")}
function renderTrends(){let tags=["#webdev","#javascript","#design","#AI","#creativecoding","#buildinpublic"];document.getElementById("trends").innerHTML=tags.map((t,i)=>`<button onclick="toast('Exploring ${t}')" class="text-xs px-3 py-1.5 rounded-full bg-white/5 border border-white/5 hover:border-cyan-500/20">${t}</button>`).join("")}
function renderRightSearch(){let q=(document.getElementById("globalSearch")?.value||"").toLowerCase(),arr=state.users.filter(u=>u.id!==session&&(u.name.toLowerCase().includes(q)||u.username.toLowerCase().includes(q))).slice(0,4);document.getElementById("rightSearch").innerHTML=arr.map(u=>`<button onclick="renderProfile('${u.id}')" class="w-full text-left flex gap-2 items-center p-1.5 rounded-lg hover:bg-white/5">${avatar(u,"w-8 h-8")}<div class="min-w-0"><div class="text-xs font-semibold truncate">${esc(u.name)}</div><div class="text-[10px] text-slate-500">@${esc(u.username)}</div></div></button>`).join("")||`<div class="text-xs text-slate-500">No creators found.</div>`}
function resetData(){openModal("Reset all data?",`<div class="space-y-4"><p class="text-sm text-red-200">This restores the seeded demo users, posts and messages.</p><button onclick="state=structuredClone(defaultState);save();closeModal();toast('Demo data reset');showView('feed')" class="w-full py-3 rounded-xl bg-red-500/80">Reset everything</button></div>`)}
function toggleMobileNav(){document.getElementById("sidebar").classList.toggle("hidden")}
window.addEventListener("storage",e=>{if(e.key===KEY){try{state=JSON.parse(e.newValue);if(session) {shell();renderCurrent()}}catch{}}});
bc&&bc.addEventListener("message",e=>{if(e.data?.type==="sync"){try{state=JSON.parse(localStorage.getItem(KEY));if(session){shell();renderCurrent()}}catch{}}});
load();
</script>
</body>
